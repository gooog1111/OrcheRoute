plugins {
    id "com.android.application"
}

import groovy.json.JsonSlurper

def orcheRouteRelease = new JsonSlurper().parse(rootProject.file("../release.json"))
def orcheRouteVersionName = orcheRouteRelease.version as String
def orcheRoutePrerelease = orcheRouteRelease.channel == "beta"

android {
    namespace "online.gooog1111.orcheroute"
    compileSdk 36

    defaultConfig {
        applicationId "online.gooog1111.orcheroute"
        minSdk 26
        targetSdk 36
		versionCode 84
		versionName orcheRouteVersionName
		resValue "color", "launcher_accent", orcheRoutePrerelease ? "#FF5B61" : "#45F3C2"
		resValue "string", "app_name", orcheRoutePrerelease ? "OrcheRoute BETA" : "OrcheRoute"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    buildFeatures {
        buildConfig true
        resValues true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        ignoreAssetsPattern = "!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~"
    }

    def canonicalWebAssets = providers.gradleProperty("orcherouteWebAssets")
            .orElse(rootProject.layout.projectDirectory.dir("../webui/out").asFile.absolutePath)
    def generatedAssetsRoot = layout.buildDirectory.dir("generated/orcherouteWebAssets").get().asFile
    def stageWebAssets = tasks.register("stageOrcheRouteWebAssets", Sync) {
        from(canonicalWebAssets)
        into(new File(generatedAssetsRoot, "web"))
    }
    sourceSets.main.assets.setSrcDirs([generatedAssetsRoot])
    tasks.named("preBuild").configure {
        dependsOn(stageWebAssets)
    }
}

def mobileCoreAar = providers.gradleProperty("orcherouteMobileCoreAar")
        .orElse(rootProject.layout.projectDirectory.dir("../dist/verify/android").file("mobilecore.aar").asFile.absolutePath)

dependencies {
    implementation files(mobileCoreAar.get())
    implementation "androidx.activity:activity:1.13.0"
    implementation "androidx.core:core:1.17.0"
    implementation "androidx.webkit:webkit:1.16.0"
    implementation "com.google.android.gms:play-services-code-scanner:16.1.0"
}
