name: Apple build

on:
  workflow_dispatch:
  push:
    paths:
      - "apple/**"
      - "mobilecore/**"
      - "internal/**"
      - "scripts/build-apple.sh"
      - "go.mod"
      - "go.sum"

jobs:
  unsigned-apple-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install build tools
        run: |
          brew install xcodegen
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
      - name: Build iOS simulator and macOS
        run: chmod +x scripts/build-apple.sh && scripts/build-apple.sh all
      - uses: actions/upload-artifact@v4
        with:
          name: orcheroute-apple-unsigned
          path: |
            dist/apple/DerivedData-iOS/Build/Products/Debug-iphonesimulator/*.app
            dist/apple/DerivedData-macOS/Build/Products/Debug/*.app
